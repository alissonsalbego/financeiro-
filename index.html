<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Teste</title>
<style>
body{margin:0;background:#1E3A5F;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,sans-serif}
.box{background:#fff;border-radius:20px;padding:32px;text-align:center;max-width:320px;margin:16px}
h1{color:#1E3A5F;font-size:22px;margin:0 0 12px}
p{color:#64748B;font-size:14px;margin:0 0 20px}
.ok{background:#27AE60;color:#fff;padding:12px 24px;border-radius:10px;border:none;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-bottom:10px}
.ok2{background:#1E3A5F;color:#fff;padding:12px 24px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;width:100%}
#r{margin-top:16px;font-size:13px;font-weight:600;line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:56px;margin-bottom:16px">💰</div>
  <h1>Organizador Financeiro</h1>
  <p id="status">Carregando...</p>
  <button class="ok" onclick="testar()">Testar JavaScript</button>
  <button class="ok2" onclick="testarStorage()">Testar Storage</button>
  <div id="r"></div>
</div>
<script>
document.getElementById('status').textContent = 'Página carregou OK';

function show(html){ document.getElementById('r').innerHTML += html + '<br>'; }

function testar(){
  document.getElementById('r').innerHTML = '';
  try {
    var arr = [1,2,3].map(function(x){ return x*2; });
    show('<span style="color:#27AE60">✅ Array.map: OK</span>');
    try {
      var obj = Object.assign({}, {a:1}, {b:2});
      show('<span style="color:#27AE60">✅ Object.assign: OK</span>');
    } catch(e){ show('<span style="color:#E74C3C">❌ Object.assign: '+e.message+'</span>'); }
    try {
      var o2 = {...{a:1}};
      show('<span style="color:#27AE60">✅ Spread operator: OK</span>');
    } catch(e){ show('<span style="color:#E74C3C">❌ Spread: '+e.message+'</span>'); }
    try {
      var f = (x) => x+1;
      show('<span style="color:#27AE60">✅ Arrow functions: OK</span>');
    } catch(e){ show('<span style="color:#E74C3C">❌ Arrow: '+e.message+'</span>'); }
    try {
      var [a,b] = [1,2];
      show('<span style="color:#27AE60">✅ Destructuring: OK</span>');
    } catch(e){ show('<span style="color:#E74C3C">❌ Destructuring: '+e.message+'</span>'); }
  } catch(e){ show('<span style="color:#E74C3C">❌ Erro geral: '+e.message+'</span>'); }
}

function testarStorage(){
  document.getElementById('r').innerHTML = '';
  try {
    localStorage.setItem('t','ok');
    var v = localStorage.getItem('t');
    localStorage.removeItem('t');
    show('<span style="color:#27AE60">✅ localStorage: '+v+'</span>');
    show('<span style="color:#27AE60">✅ Safari modo normal</span>');
  } catch(e){
    show('<span style="color:#E74C3C">❌ localStorage bloqueado!</span>');
    show('<span style="color:#F39C12">⚠ Provável causa: Safari em modo privado ou restrições de privacidade</span>');
  }
}
</script>
</body>
</html>
