<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Financeiro"/>
<meta name="theme-color" content="#1E3A5F"/>
<title>Organizador Financeiro</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F0F4F8;min-height:100vh}
input,select,textarea,button{font-family:inherit;font-size:14px}
button{cursor:pointer}
.header{background:#1E3A5F;padding:0 16px}
.header-top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 12px}
.header-title{font-size:19px;font-weight:800;color:#fff;letter-spacing:-0.5px}
.header-sub{font-size:12px;color:#93C5FD;margin-top:2px}
.header-btns{display:flex;gap:8px}
.btn-report{display:flex;align-items:center;gap:5px;padding:8px 12px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:8px;font-size:13px;font-weight:600}
.btn-add{display:flex;align-items:center;gap:5px;padding:8px 14px;background:#2ECC71;border:none;color:#fff;border-radius:8px;font-size:14px;font-weight:700}
.tabs{display:flex;gap:2px}
.tab{display:flex;align-items:center;gap:5px;padding:9px 16px;border:none;border-radius:8px 8px 0 0;font-size:13px;font-weight:500;color:rgba(255,255,255,0.7);background:transparent}
.tab.active{background:#fff;color:#1E3A5F;font-weight:700}
.body{max-width:860px;margin:0 auto;padding:16px 14px 80px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.card{border-radius:12px;padding:14px 16px;border-left:4px solid}
.card-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.card-value{font-size:19px;font-weight:800}
.banner{border-radius:10px;padding:11px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:none;width:100%;text-align:left;cursor:pointer}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search-input{flex:1 1 180px;max-width:240px;padding:10px 12px;border-radius:8px;border:1.5px solid #CBD5E1;background:#F8FAFC;font-size:14px;outline:none}
.filter-btns{display:flex;gap:5px;flex-wrap:wrap}
.filter-btn{padding:8px 12px;border-radius:8px;border:1.5px solid #CBD5E1;background:#fff;color:#374151;font-size:12px;font-weight:600}
.filter-btn.active{background:#1E3A5F;border-color:#1E3A5F;color:#fff}
.bill-row{background:#fff;border-radius:12px;border:1px solid #E2E8F0;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:8px}
.bill-strip{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0}
.bill-info{flex:1;min-width:0}
.bill-name{font-weight:700;font-size:15px;color:#1E3A5F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-cat{font-size:12px;color:#64748B;margin-top:2px}
.bill-days{font-size:11px;margin-top:4px;font-weight:600}
.bill-right{text-align:right;flex-shrink:0}
.bill-amount{font-weight:800;font-size:16px;color:#1E3A5F}
.bill-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;margin-top:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid #E2E8F0}
.modal-header h3{font-size:17px;font-weight:700;color:#1E3A5F}
.modal-close{background:none;border:none;font-size:22px;color:#64748B;padding:4px;line-height:1}
.modal-body{padding:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:13px;font-weight:600;color:#374151}
.form-input{padding:10px 12px;border-radius:8px;border:1.5px solid #CBD5E1;font-size:14px;color:#1A202C;background:#F8FAFC;width:100%;outline:none}
.form-textarea{padding:10px 12px;border-radius:8px;border:1.5px solid #CBD5E1;font-size:14px;background:#F8FAFC;width:100%;min-height:60px;resize:vertical;outline:none}
.form-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
.btn-cancel{padding:10px 20px;border-radius:8px;border:1.5px solid #CBD5E1;background:#fff;color:#374151;font-size:14px;font-weight:600}
.btn-save{padding:10px 22px;border-radius:8px;border:none;background:#1E3A5F;color:#fff;font-size:14px;font-weight:700}
.btn-save:disabled{background:#94A3B8}
.btn-pay-big{flex:1;padding:12px;border-radius:10px;border:none;background:#27AE60;color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-edit{padding:12px 16px;border-radius:10px;border:1.5px solid #CBD5E1;background:#fff;color:#374151;font-size:13px;font-weight:600}
.btn-del{padding:12px 16px;border-radius:10px;border:1.5px solid #FECACA;background:#FFF5F5;color:#E74C3C;font-size:13px;font-weight:600}
.upload-area{border:2px dashed #CBD5E1;border-radius:10px;padding:20px;text-align:center;cursor:pointer;background:#F8FAFC;margin-bottom:8px}
.alert-box{display:flex;align-items:center;gap:8px;background:#FFF8E1;border:1px solid #F39C12;border-radius:8px;padding:10px 14px;font-size:13px;color:#92400E;margin-bottom:12px}
.detail-header{background:#1E3A5F;padding:0 16px}
.detail-header-inner{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.btn-back{background:rgba(255,255,255,0.15);border:none;border-radius:10px;padding:8px 12px;color:#fff;font-size:20px;line-height:1}
.detail-body{padding:16px 14px 60px;max-width:600px;margin:0 auto}
.dcard{background:#fff;border-radius:16px;border:1px solid #E2E8F0;padding:18px;margin-bottom:14px}
.dcard h3{font-size:14px;font-weight:700;color:#1E3A5F;margin-bottom:14px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-box{border-radius:10px;padding:12px}
.info-label{font-size:11px;color:#64748B;font-weight:600;margin-bottom:4px}
.info-val{font-size:15px;font-weight:700;color:#1E3A5F}
.paid-bar{background:#E8F5E9;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.action-btns{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.history-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #F1F5F9}
.history-row:last-child{border-bottom:none}
.h-icon{width:36px;height:36px;border-radius:99px;background:#E8F5E9;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px}
.h-info{flex:1}
.h-month{font-size:13px;font-weight:700;color:#1E3A5F}
.h-date{font-size:12px;color:#64748B}
.h-right{text-align:right}
.h-amount{font-size:15px;font-weight:700;color:#27AE60}
.btn-proof-sm{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;border:1px solid #27AE60;background:#E8F5E9;color:#27AE60;font-size:11px;font-weight:600;margin-top:4px}
.no-proof-sm{font-size:11px;color:#F39C12;font-weight:600;margin-top:4px}
.future-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F1F5F9}
.future-row:last-child{border-bottom:none}
.fbadge{font-size:11px;padding:2px 8px;border-radius:99px;background:#E3F2FD;color:#1976D2;font-weight:600}
.share-panel{background:#fff;border-radius:14px;border:1px solid #E2E8F0;padding:18px;margin-bottom:16px}
.share-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-wa{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:10px;background:#25D366;color:#fff;text-decoration:none;font-weight:700;font-size:14px;border:none}
.btn-pdf-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:10px;background:#E74C3C;color:#fff;font-weight:700;font-size:14px;border:none}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px}
.cal-dh{text-align:center;font-size:11px;font-weight:700;color:#64748B;padding:5px 0}
.cal-cell{border:1px solid #E2E8F0;border-radius:8px;padding:4px 3px;min-height:58px;background:#fff}
.cal-cell.today{border:2px solid #1E3A5F;background:#EBF4FF}
.cal-num{font-size:12px;text-align:center;margin-bottom:2px;font-weight:500;color:#374151}
.cal-cell.today .cal-num{font-weight:800;color:#1E3A5F}
.cal-pill{font-size:9px;border-radius:3px;padding:2px 3px;margin-top:2px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;display:block}
.empty{text-align:center;padding:40px 16px;color:#94A3B8}
.sep{height:1px;background:#E2E8F0;margin:14px 0}
.no-proof-box{background:#FFF8E1;border:1px solid #F39C12;border-radius:12px;padding:16px;margin-bottom:16px}
.proof-img{max-width:100%;border-radius:10px}
.btn-dl{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:#1E3A5F;color:#fff;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;margin-top:12px;border:none}
.sec-title{font-size:15px;font-weight:700;color:#1E3A5F;margin:16px 0 10px}
.cat-bar{background:#F1F5F9;border-radius:99px;height:8px;margin:8px 0 10px;overflow:hidden;display:flex}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.leg-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.leg-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding:0 4px;margin-bottom:8px}
.bar-col{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.bar-fill{background:#1E3A5F;border-radius:4px 4px 0 0;width:100%;min-height:4px;opacity:0.85}
.bar-lbl{font-size:9px;color:#64748B;margin-top:4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.bar-val{font-size:8px;color:#1E3A5F;font-weight:700;text-align:center;margin-bottom:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── Helpers
var STORAGE_KEY='fin_v6';
var SL={pending:'Pendente',paid:'Pago',overdue:'Atrasado',future:'Futuro'};
var SC={pending:{bg:'#FFF8E1',tx:'#F39C12',br:'#F39C12'},paid:{bg:'#E8F5E9',tx:'#27AE60',br:'#27AE60'},overdue:{bg:'#FFEBEE',tx:'#E74C3C',br:'#E74C3C'},future:{bg:'#E3F2FD',tx:'#1976D2',br:'#1976D2'}};
var CATS=['Moradia','Energia','Água','Internet/Telefone','Alimentação','Saúde','Educação','Transporte','Entretenimento','Cartão de Crédito','Empréstimo','Outros'];
function fmt(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);}
function fd(d){if(!d)return'—';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function today(){return new Date().toISOString().split('T')[0];}
function cs(b){if(b.status==='paid')return'paid';if(b.dueDate<today())return'overdue';if((new Date(b.dueDate)-new Date())/86400000>30)return'future';return'pending';}
function am(ds,n){var d=new Date(ds+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().split('T')[0];}
function svgp(name,amount,date,color){var s='<svg width="400" height="240" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="240" fill="#f0f4f8"/><rect x="16" y="16" width="368" height="208" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="16" y="16" width="368" height="50" rx="12" fill="'+color+'"/><rect x="16" y="46" width="368" height="20" fill="'+color+'"/><text x="200" y="47" text-anchor="middle" fill="#fff" font-family="Arial" font-size="13" font-weight="bold">COMPROVANTE DE PAGAMENTO</text><text x="32" y="95" fill="#374151" font-family="Arial" font-size="13">'+name+'</text><text x="32" y="118" fill="#374151" font-family="Arial" font-size="12">Vence: '+date+'</text><text x="32" y="152" fill="#1e3a5f" font-family="Arial" font-size="20" font-weight="bold">'+amount+'</text><rect x="24" y="170" width="352" height="1" fill="#e2e8f0"/><text x="32" y="194" fill="#27ae60" font-family="Arial" font-size="12" font-weight="bold">PAGAMENTO CONFIRMADO</text></svg>';return{name:'comprovante.png',type:'image/png',data:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)};}

// ── State
var S={bills:null,tab:'bills',filter:'all',search:'',detail:null,modal:null,mdata:null,eform:null};

function loadBills(){try{var s=localStorage.getItem(STORAGE_KEY);if(s)return JSON.parse(s);}catch(e){}return null;}
function save(bills){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(bills));}catch(e){}}

function setState(patch){Object.assign(S,patch);render();}

// ── DOM helpers
function el(tag,cls,html,onClick){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(html)e.innerHTML=html;
  if(onClick)e.addEventListener('click',onClick);
  return e;
}
function div(cls,html,onClick){return el('div',cls,html,onClick);}
function btn(cls,html,onClick){var b=el('button',cls,html,onClick);return b;}
function bdg(status){
  var c=SC[status]||SC.pending;
  var s=el('span','bill-badge');
  s.style.cssText='background:'+c.bg+';color:'+c.tx+';border:1px solid '+c.br;
  s.textContent=SL[status];return s;
}

// ── Render
function render(){
  var app=document.getElementById('app');
  app.innerHTML='';
  if(S.detail) return renderDetail(app);
  renderMain(app);
  if(S.modal) renderModal(app);
}

function renderMain(app){
  // Header
  var h=div('header');
  var ht=div('header-top');
  var hl=div('');
  hl.innerHTML='<div class="header-title">💰 Organizador Financeiro</div><div class="header-sub">'+S.bills.length+' contas cadastradas</div>';
  var hb=div('header-btns');
  hb.appendChild(btn('btn-report','📤 Relatório',function(){setState({tab:'analytics'});}));
  hb.appendChild(btn('btn-add','+ Nova Conta',function(){setState({modal:'add',eform:{name:'',category:'Outros',amount:'',dueDate:'',bestPayDate:'',recurrent:false,notes:''}});}));
  ht.appendChild(hl);ht.appendChild(hb);h.appendChild(ht);
  var tabs=div('tabs');
  [['bills','≡ Contas'],['calendar','📅 Calendário'],['analytics','📊 Análise']].forEach(function(t){
    tabs.appendChild(btn('tab'+(S.tab===t[0]?' active':''),t[1],function(){setState({tab:t[0]});}));
  });
  h.appendChild(tabs);app.appendChild(h);
  var body=div('body');
  if(S.tab==='bills') renderBills(body);
  else if(S.tab==='calendar') renderCal(body);
  else renderAnalytics(body);
  app.appendChild(body);
}

function renderBills(body){
  var td=today();
  var live=S.bills.map(function(b){return Object.assign({},b,{_s:cs(b)});});
  var overdue=S.bills.filter(function(b){return b.status!=='paid'&&b.dueDate<td;});
  var soon=S.bills.filter(function(b){if(b.status==='paid')return false;var d=(new Date(b.dueDate)-new Date())/86400000;return d>=0&&d<=5;});
  // Banners
  if(overdue.length){
    var ob=btn('banner','',function(){setState({tab:'bills',filter:'overdue'});});
    ob.style.cssText='background:#FFEBEE;border:1px solid #E74C3C';
    ob.innerHTML='<span style="color:#C0392B;font-weight:600;font-size:13px">⚠️ '+overdue.length+' conta(s) em atraso: '+overdue.map(function(b){return b.name;}).join(', ')+'</span><span style="color:#E74C3C;font-size:12px;font-weight:700;white-space:nowrap">Ver →</span>';
    body.appendChild(ob);
  }
  if(soon.length){
    var sb=btn('banner','',function(){setState({tab:'bills',filter:'pending'});});
    sb.style.cssText='background:#FFF8E1;border:1px solid #F39C12';
    sb.innerHTML='<span style="color:#92400E;font-weight:600;font-size:13px">🔔 Vence em 5 dias: '+soon.map(function(b){return b.name;}).join(', ')+'</span><span style="color:#F39C12;font-size:12px;font-weight:700;white-space:nowrap">Ver →</span>';
    body.appendChild(sb);
  }
  // Cards
  var total=live.reduce(function(s,b){return s+Number(b.amount);},0);
  var tpaid=live.filter(function(b){return b._s==='paid';}).reduce(function(s,b){return s+Number(b.amount);},0);
  var tpend=live.filter(function(b){return b._s==='pending';}).reduce(function(s,b){return s+Number(b.amount);},0);
  var tov=live.filter(function(b){return b._s==='overdue';}).reduce(function(s,b){return s+Number(b.amount);},0);
  var cg=div('cards');
  [{l:'💰 Total',v:fmt(total),bg:'#EBF4FF',c:'#1E3A5F',br:'#1E3A5F'},{l:'✅ Pago',v:fmt(tpaid),bg:'#E8F5E9',c:'#27AE60',br:'#27AE60'},{l:'⏳ Pendente',v:fmt(tpend),bg:'#FFF8E1',c:'#F39C12',br:'#F39C12'},{l:'⚠️ Atrasado',v:fmt(tov),bg:'#FFEBEE',c:'#E74C3C',br:'#E74C3C'}].forEach(function(c){
    var card=div('card');card.style.cssText='background:'+c.bg+';border-left-color:'+c.br;
    card.innerHTML='<div class="card-label" style="color:'+c.c+'">'+c.l+'</div><div class="card-value" style="color:'+c.c+'">'+c.v+'</div>';
    cg.appendChild(card);
  });
  body.appendChild(cg);
  // Filters
  var flt=div('filters');
  var si=document.createElement('input');
  si.className='search-input';si.placeholder='🔍 Buscar...';si.value=S.search;
  si.addEventListener('input',function(){setState({search:si.value});});
  flt.appendChild(si);
  var fb=div('filter-btns');
  [['all','Todas'],['overdue','Atrasadas'],['pending','Pendentes'],['future','Futuras'],['paid','Pagas']].forEach(function(f){
    fb.appendChild(btn('filter-btn'+(S.filter===f[0]?' active':''),f[1],function(){setState({filter:f[0]});}));
  });
  flt.appendChild(fb);body.appendChild(flt);
  // Bills
  var filtered=live.filter(function(b){
    if(S.search&&b.name.toLowerCase().indexOf(S.search.toLowerCase())<0&&b.category.toLowerCase().indexOf(S.search.toLowerCase())<0)return false;
    if(S.filter==='all')return true;return b._s===S.filter;
  }).sort(function(a,b){return a.dueDate.localeCompare(b.dueDate);});
  if(!filtered.length){body.appendChild(div('empty','<div style="font-size:36px;margin-bottom:12px">📋</div><div style="font-size:15px;font-weight:600">Nenhuma conta encontrada</div>'));return;}
  filtered.forEach(function(b){
    var sc=SC[b._s];
    var dl=Math.ceil((new Date(b.dueDate)-new Date())/86400000);
    var dtxt,dcol;
    if(b._s==='paid'){dtxt='Pago em '+fd(b.paidAt);dcol='#94A3B8';}
    else if(dl<0){dtxt=Math.abs(dl)+'d em atraso';dcol='#E74C3C';}
    else if(dl===0){dtxt='Vence hoje!';dcol='#F39C12';}
    else{dtxt=dl+'d restantes · '+fd(b.dueDate);dcol=dl<=5?'#F39C12':'#94A3B8';}
    var row=div('bill-row',null,function(){setState({detail:b.id});});
    var strip=div('bill-strip');strip.style.background=sc.br;
    var info=div('bill-info');
    info.innerHTML='<div class="bill-name">'+b.name+'</div><div class="bill-cat">'+b.category+(b.recurrent?' ↻':'')+'</div><div class="bill-days" style="color:'+dcol+'">'+dtxt+'</div>';
    var right=div('bill-right');
    right.innerHTML='<div class="bill-amount">'+fmt(b.amount)+'</div>';
    right.appendChild(bdg(b._s));
    if(b._s==='paid'&&!b.proof)right.innerHTML+='<div style="font-size:10px;color:#F39C12;font-weight:600;margin-top:3px">⚠ Sem comprov.</div>';
    row.appendChild(strip);row.appendChild(info);row.appendChild(right);
    row.appendChild(div('','>'));
    body.appendChild(row);
  });
}

function renderDetail(app){
  var bill=null;
  for(var i=0;i<S.bills.length;i++){if(S.bills[i].id===S.detail){bill=S.bills[i];break;}}
  if(!bill){setState({detail:null});return;}
  var status=cs(bill);
  var history=(bill.history||[]).slice().reverse();
  var totalPaid=(bill.history||[]).reduce(function(s,h){return s+Number(h.amount);},0)+(bill.status==='paid'?Number(bill.amount):0);
  var wrap=div('');
  var hdr=div('detail-header');

function renderCal(body){
  var now=new Date();var year=now.getFullYear();var month=now.getMonth();
  var dim=new Date(year,month+1,0).getDate();var fd1=new Date(year,month,1).getDay();
  var byDay={};
  S.bills.forEach(function(b){var d=new Date(b.dueDate+'T12:00:00');if(d.getFullYear()===year&&d.getMonth()===month){var day=d.getDate();if(!byDay[day])byDay[day]=[];byDay[day].push(b);}});

function exportPDF(live,tpaid,tpend,tov){
  var pending=live.filter(function(b){return b._s!=='paid';});
  var overdue=live.filter(function(b){return b._s==='overdue';});
  var paid=live.filter(function(b){return b._s==='paid';});
  var row=function(b){return'<tr><td>'+b.name+'</td><td>'+b.category+'</td><td style="text-align:right;font-weight:700">'+fmt(b.amount)+'</td><td style="text-align:center">'+fd(b.dueDate)+'</td><td style="text-align:center">'+SL[b._s]+'</td><td style="text-align:center">'+(b.proof?'✅':'—')+'</td></tr>';};
  var tbl=function(title,items){return items.length?'<h2>'+title+' ('+items.length+')</h2><table><thead><tr><th>Nome</th><th>Categoria</th><th>Valor</th><th>Vencimento</th><th>Status</th><th>Comprovante</th></tr></thead><tbody>'+items.map(row).join('')+'</tbody></table>':'';};
  var card=function(l,v,bg,bc){return'<div style="background:'+bg+';border-left:4px solid '+bc+';border-radius:10px;padding:14px 18px;flex:1;min-width:130px"><div style="font-size:11px;font-weight:700;color:'+bc+';text-transform:uppercase;margin-bottom:4px">'+l+'</div><div style="font-size:22px;font-weight:800;color:'+bc+'">'+v+'</div></div>';};
  var html='<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;padding:24px;background:#f0f4f8}.w{max-width:800px;margin:0 auto;background:#fff;border-radius:16px;padding:32px}h1{color:#1E3A5F;margin:0 0 4px}.d{color:#64748B;font-size:14px;margin-bottom:24px}.c{display:flex;gap:12px;margin-bottom:28px;flex-wrap:wrap}h2{color:#1E3A5F;margin:24px 0 10px;font-size:16px;border-bottom:2px solid #E2E8F0;padding-bottom:8px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#1E3A5F;color:#fff;padding:10px 12px;text-align:left}td{padding:9px 12px;border-bottom:1px solid #E2E8F0}tr:nth-child(even) td{background:#F8FAFC}.ft{margin-top:28px;font-size:12px;color:#94A3B8;text-align:center;border-top:1px solid #E2E8F0;padding-top:16px}@media print{body{background:#fff;padding:0}.w{box-shadow:none}}</style></head><body><div class="w"><h1>📊 Relatório Financeiro</h1><div class="d">'+new Date().toLocaleDateString('pt-BR',{dateStyle:'full'})+'</div><div class="c">'+card('✓ Pago',fmt(tpaid),'#E8F5E9','#27AE60')+card('⏳ Pendente',fmt(tpend),'#FFF8E1','#F39C12')+(tov>0?card('⚠ Atrasado',fmt(tov),'#FFEBEE','#E74C3C'):'')+'</div>'+tbl('🔴 Atrasadas',overdue)+tbl('⏳ Pendentes',pending.filter(function(b){return b._s!=='overdue';}))+tbl('✅ Pagas',paid)+'<div class="ft">Organizador Financeiro · Imprimir → Salvar como PDF</div></div></body></html>';
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='relatorio-'+today()+'.html';a.click();
}
