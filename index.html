const fmt = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v||0);
const fmtDate = d => { if(!d) return "—"; const [y,m,day]=d.split("-"); return day+"/"+m+"/"+y; };
const todayStr = () => new Date().toISOString().split("T")[0];
const computeStatus = b => {
  if(b.status==="paid") return "paid";
  if(b.dueDate<todayStr()) return "overdue";
  if((new Date(b.dueDate)-new Date())/86400000>30) return "future";
  return "pending";
};
const addMonths = (dateStr, n) => {
  const d = new Date(dateStr+"T12:00:00");
  d.setMonth(d.getMonth()+n);
  return d.toISOString().split("T")[0];
};

function makeSVGProof(name,amount,date,color){
  const svg='<svg width="400" height="260" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="260" fill="#f0f4f8"/><rect x="20" y="20" width="360" height="220" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="2"/><rect x="20" y="20" width="360" height="52" rx="12" fill="'+color+'"/><rect x="20" y="52" width="360" height="20" fill="'+color+'"/><text x="200" y="52" text-anchor="middle" fill="#fff" font-family="Arial" font-size="15" font-weight="bold">COMPROVANTE DE PAGAMENTO</text><text x="40" y="105" fill="#374151" font-family="Arial" font-size="13">'+name+'</text><text x="40" y="130" fill="#374151" font-family="Arial" font-size="13">Vencimento: '+date+'</text><text x="40" y="165" fill="#1e3a5f" font-family="Arial" font-size="22" font-weight="bold">'+amount+'</text><rect x="30" y="185" width="340" height="1" fill="#e2e8f0"/><text x="40" y="210" fill="#27ae60" font-family="Arial" font-size="14" font-weight="bold">PAGAMENTO CONFIRMADO</text></svg>';
  return { name:"comprovante.png", type:"image/png", data:"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg) };
}

function useStorage(key,initial){
  const [val,setVal]=useState(()=>{ try{ const s=localStorage.getItem(key); return s?JSON.parse(s):initial; }catch{ return initial; } });
  useEffect(()=>{ try{ localStorage.setItem(key,JSON.stringify(val)); }catch{} },[key,val]);
  return [val,setVal];
}

function Modal({open,onClose,title,children}){
  if(!open) return null;
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.55)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,width:"100%",maxWidth:520,maxHeight:"90vh",overflowY:"auto",boxShadow:"0 24px 64px rgba(0,0,0,0.22)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"18px 20px 14px",borderBottom:"1px solid #E2E8F0"}}>
          <h3 style={{margin:0,fontSize:17,fontWeight:700,color:"#1E3A5F"}}>{title}</h3>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",color:"#64748B",display:"flex",padding:4}}><Icon name="close" size={20}/></button>
        </div>
        <div style={{padding:20}}>{children}</div>
      </div>
    </div>
  );
}

  const c=STATUS_COLOR[status]||STATUS_COLOR.pending;
  return <span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:99,fontSize:12,fontWeight:600,background:c.bg,color:c.text,border:"1px solid "+c.border}}>{STATUS_LABEL[status]}</span>;
}

function BillDetail({bill,onBack,onPay,onEdit,onDelete,onAddProof,bills,setBills}){
  const [proofItem,setProofItem]=useState(null);
  const status=computeStatus(bill);
  const sc=STATUS_COLOR[status];

  // Gera próximas parcelas futuras p/ recorrentes
  const futureItems = useMemo(()=>{
    if(!bill.recurrent) return [];
    const items=[];
    const base = bill.status==="paid" ? addMonths(bill.dueDate,1) : bill.dueDate;
    for(let i=0;i<3;i++){
      const d=addMonths(base,i+( bill.status==="paid"?0:1 ));
      items.push({month:new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{month:"short",year:"numeric"}),dueDate:d});
    }
    return items;
  },[bill]);

  const history=[...(bill.history||[])].reverse();
  const totalPaid=(bill.history||[]).reduce((s,h)=>s+Number(h.amount),0)+(bill.status==="paid"?Number(bill.amount):0);

  return (
    <div style={{minHeight:"100vh",background:"#F0F4F8",fontFamily:"'Segoe UI',system-ui,sans-serif"}}>
      {/* Header */}
      <div style={{background:"#1E3A5F",padding:"0 16px"}}>

            <Icon name="back" size={20} color="#fff"/>
          </button>
          <div style={{flex:1}}>
            <div style={{fontSize:18,fontWeight:800,color:"#fff",lineHeight:1.2}}>{bill.name}</div>
            <div style={{fontSize:12,color:"#93C5FD",marginTop:2}}>{bill.category}{bill.recurrent&&" · Recorrente"}</div>
          </div>
          <Badge status={status}/>
        </div>
      </div>

      <div style={{padding:"16px 14px 60px",maxWidth:600,margin:"0 auto"}}>

        {/* Info card */}
        <div style={{background:"#fff",borderRadius:16,border:"1px solid #E2E8F0",padding:18,marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>

  const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const ok=f.name.trim()&&f.amount&&f.dueDate;
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:13,fontWeight:600,color:"#374151"}}>Nome *</label>
          <input style={inp} value={f.name} placeholder="Ex: Conta de Luz" onChange={e=>set("name",e.target.value)}/>

        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:13,fontWeight:600,color:"#374151"}}>Vencimento *</label>
          <input style={inp} type="date" value={f.dueDate} onChange={e=>set("dueDate",e.target.value)}/>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:13,fontWeight:600,color:"#374151"}}>Melhor data p/ pagar</label>
          <input style={inp} type="date" value={f.bestPayDate} onChange={e=>set("bestPayDate",e.target.value)}/>

        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:22}}>

      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        <label style={{fontSize:13,fontWeight:600,color:"#374151"}}>Observações</label>
        <textarea style={{...inp,resize:"vertical",minHeight:60}} value={f.notes} placeholder="Detalhes..." onChange={e=>set("notes",e.target.value)}/>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:4}}>
        <button onClick={onCancel} style={{padding:"10px 20px",borderRadius:8,border:"1.5px solid #CBD5E1",background:"#fff",cursor:"pointer",fontSize:14,fontWeight:600,color:"#374151"}}>Cancelar</button>
        <button onClick={()=>ok&&onSave(f)} disabled={!ok} style={{padding:"10px 22px",borderRadius:8,border:"none",background:ok?"#1E3A5F":"#94A3B8",color:"#fff",cursor:ok?"pointer":"not-allowed",fontSize:14,fontWeight:700}}>Salvar</button>
      </div>
    </div>
  );
}

function PayModal({bill,onPay,onCancel}){
  const [payDate,setPayDate]=useState(todayStr());
  const [preview,setPreview]=useState(null);
  const ref=useRef();
  const handleFile=e=>{
    const file=e.target.files[0]; if(!file) return;
    const r=new FileReader(); r.onload=ev=>setPreview({name:file.name,data:ev.target.result,type:file.type}); r.readAsDataURL(file);
  };
  return (
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:"#F1F5F9",borderRadius:10,padding:14}}>
        <div style={{fontWeight:700,fontSize:16,color:"#1E3A5F"}}>{bill.name}</div>
        <div style={{fontSize:22,fontWeight:800,color:"#27AE60",marginTop:4}}>{fmt(bill.amount)}</div>
        <div style={{fontSize:13,color:"#64748B",marginTop:2}}>Vencimento: {fmtDate(bill.dueDate)}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        <label style={{fontSize:13,fontWeight:600,color:"#374151"}}>Data do pagamento</label>
        <input style={inp} type="date" value={payDate} onChange={e=>setPayDate(e.target.value)}/>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        <label style={{fontSize:13,fontWeight:600,color:"#374151"}}>Comprovante</label>
        <div onClick={()=>ref.current.click()} style={{border:"2px dashed #CBD5E1",borderRadius:10,padding:16,textAlign:"center",cursor:"pointer",background:"#F8FAFC"}}>
          {preview?(
            <div>
              {preview.type.startsWith("image/")?<img src={preview.data} alt="" style={{maxHeight:120,borderRadius:8,maxWidth:"100%"}}/>:<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:"#1E3A5F"}}><Icon name="pdf" size={26}/><span style={{fontWeight:600}}>{preview.name}</span></div>}
              <div style={{fontSize:12,color:"#64748B",marginTop:6}}>Clique para trocar</div>
            </div>
          ):(
            <div style={{color:"#94A3B8"}}><Icon name="clip" size={24} color="#94A3B8"/><div style={{marginTop:8,fontSize:14}}>Clique para anexar comprovante</div><div style={{fontSize:12,marginTop:4}}>Imagem ou PDF</div></div>
          )}
        </div>
        <input ref={ref} type="file" accept="image/*,.pdf" style={{display:"none"}} onChange={handleFile}/>
      </div>
      {!preview&&<div style={{display:"flex",alignItems:"center",gap:8,background:"#FFF8E1",border:"1px solid #F39C12",borderRadius:8,padding:"10px 14px"}}><Icon name="alert" size={15} color="#F39C12"/><span style={{fontSize:13,color:"#92400E"}}>Sem comprovante: ficará como <strong>Pago sem comprovante</strong></span></div>}
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button onClick={onCancel} style={{padding:"10px 18px",borderRadius:8,border:"1.5px solid #CBD5E1",background:"#fff",cursor:"pointer",fontSize:14,fontWeight:600,color:"#374151"}}>Cancelar</button>
        <button onClick={()=>onPay({payDate,proof:preview})} style={{padding:"10px 22px",borderRadius:8,border:"none",background:"#27AE60",color:"#fff",cursor:"pointer",fontSize:14,fontWeight:700,display:"flex",alignItems:"center",gap:6}}><Icon name="check" size={15} color="#fff"/>Confirmar</button>
      </div>
    </div>
  );
}

function NoProofModal({bill,onClose,onAddProof}){
  const ref=useRef();
  const handleFile=e=>{ const file=e.target.files[0]; if(!file) return; const r=new FileReader(); r.onload=ev=>onAddProof(bill.id,{name:file.name,data:ev.target.result,type:file.type}); r.readAsDataURL(file); };
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:14,background:"#FFF8E1",border:"1px solid #F39C12",borderRadius:12,padding:16}}>
        <div style={{flexShrink:0,width:40,height:40,borderRadius:99,background:"#FEF3C7",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon name="alert" size={22} color="#F39C12"/></div>
        <div><div style={{fontWeight:700,fontSize:15,color:"#92400E",marginBottom:6}}>Pago sem comprovante</div><div style={{fontSize:13,color:"#78350F",lineHeight:1.6}}>A conta <strong>{bill.name}</strong> foi marcada como paga em <strong>{fmtDate(bill.paidAt)}</strong>, mas nenhum comprovante foi anexado.</div></div>
      </div>
      <div onClick={()=>ref.current.click()} style={{border:"2px dashed #F39C12",borderRadius:10,padding:20,textAlign:"center",cursor:"pointer",background:"#FFFBF0"}}>
        <Icon name="clip" size={26} color="#F39C12"/><div style={{marginTop:8,fontSize:14,fontWeight:600,color:"#92400E"}}>Anexar comprovante agora</div>

      <input ref={ref} type="file" accept="image/*,.pdf" style={{display:"none"}} onChange={handleFile}/>

    </div>
  );
}

function SummaryCards({bills}){
  const live=bills.map(b=>({...b,_s:computeStatus(b)}));
  const total=live.reduce((s,b)=>s+Number(b.amount),0);
  const paid=live.filter(b=>b._s==="paid").reduce((s,b)=>s+Number(b.amount),0);
  const overdue=live.filter(b=>b._s==="overdue").reduce((s,b)=>s+Number(b.amount),0);
  const pending=live.filter(b=>b._s==="pending").reduce((s,b)=>s+Number(b.amount),0);
  const cards=[
    {label:"Total",value:fmt(total),color:"#1E3A5F",light:"#EBF4FF",icon:"list"},
    {label:"Pago",value:fmt(paid),color:"#27AE60",light:"#E8F5E9",icon:"check"},
    {label:"Pendente",value:fmt(pending),color:"#F39C12",light:"#FFF8E1",icon:"bell"},
    {label:"Atrasado",value:fmt(overdue),color:"#E74C3C",light:"#FFEBEE",icon:"alert"},
  ];
  return (
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:10,marginBottom:20}}>
      {cards.map(c=>(
        <div key={c.label} style={{background:c.light,borderRadius:12,padding:"14px 16px",borderLeft:"4px solid "+c.color}}>
          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}><Icon name={c.icon} size={14} color={c.color}/><span style={{fontSize:11,fontWeight:700,color:c.color,textTransform:"uppercase",letterSpacing:0.5}}>{c.label}</span></div>
          <div style={{fontSize:20,fontWeight:800,color:c.color}}>{c.value}</div>
        </div>
      ))}
    </div>
  );
}

function AlertBanner({bills,onFilterClick}){
  const today=todayStr();
  const overdue=bills.filter(b=>b.status!=="paid"&&b.dueDate<today);
  const soon=bills.filter(b=>{ if(b.status==="paid") return false; const d=(new Date(b.dueDate)-new Date())/86400000; return d>=0&&d<=5; });
  if(!overdue.length&&!soon.length) return null;
  const cs={background:"none",border:"none",textAlign:"left",cursor:"pointer",padding:0,width:"100%",display:"block"};
  return (
    <div style={{marginBottom:16}}>
      {overdue.length>0&&(
        <button onClick={()=>onFilterClick("overdue")} style={cs}>
          <div style={{background:"#FFEBEE",border:"1px solid #E74C3C",borderRadius:10,padding:"11px 14px",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}><Icon name="alert" size={16} color="#E74C3C"/><span style={{fontSize:13,color:"#C0392B",fontWeight:600}}>{overdue.length} conta(s) em atraso: {overdue.map(b=>b.name).join(", ")}</span></div>
            <span style={{fontSize:12,color:"#E74C3C",fontWeight:700,whiteSpace:"nowrap"}}>Ver →</span>
          </div>
        </button>
      )}
      {soon.length>0&&(
        <button onClick={()=>onFilterClick("pending")} style={cs}>
          <div style={{background:"#FFF8E1",border:"1px solid #F39C12",borderRadius:10,padding:"11px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}><Icon name="bell" size={16} color="#F39C12"/><span style={{fontSize:13,color:"#92400E",fontWeight:600}}>Vence em até 5 dias: {soon.map(b=>b.name+" ("+fmtDate(b.dueDate)+")").join(", ")}</span></div>
            <span style={{fontSize:12,color:"#F39C12",fontWeight:700,whiteSpace:"nowrap"}}>Ver →</span>
          </div>
        </button>
      )}
    </div>
  );
}

function BillRow({bill,onClick}){
  const status=computeStatus(bill);
  const daysLeft=Math.ceil((new Date(bill.dueDate)-new Date())/86400000);
  const sc=STATUS_COLOR[status];
  return (
    <div onClick={onClick} style={{background:"#fff",borderRadius:12,border:"1px solid #E2E8F0",padding:"12px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",transition:"box-shadow 0.15s"}}
      onMouseEnter={e=>e.currentTarget.style.boxShadow="0 4px 12px rgba(0,0,0,0.08)"}
      onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
      {/* Color strip */}
      <div style={{width:4,alignSelf:"stretch",borderRadius:4,background:sc.border,flexShrink:0}}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:700,fontSize:15,color:"#1E3A5F",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{bill.name}</div>
        <div style={{fontSize:12,color:"#64748B",marginTop:2}}>{bill.category}{bill.recurrent&&<span style={{marginLeft:6,color:"#1976D2",fontWeight:600}}>↻</span>}</div>
        <div style={{fontSize:11,marginTop:4,color:daysLeft<0?"#E74C3C":daysLeft<=5?"#F39C12":"#94A3B8",fontWeight:600}}>
          {status==="paid"?"Pago em "+fmtDate(bill.paidAt):daysLeft<0?Math.abs(daysLeft)+"d em atraso":daysLeft===0?"Vence hoje!":daysLeft+"d restantes · vence "+fmtDate(bill.dueDate)}
        </div>
      </div>
      <div style={{textAlign:"right",flexShrink:0}}>
        <div style={{fontWeight:800,fontSize:16,color:"#1E3A5F"}}>{fmt(bill.amount)}</div>
        <div style={{marginTop:4}}><Badge status={status}/></div>
        {status==="paid"&&!bill.proof&&<div style={{fontSize:10,color:"#F39C12",fontWeight:600,marginTop:3}}>⚠ Sem comprov.</div>}
      </div>

}

function DonutChart({segments,size=160}){
  const r=58,cx=size/2,cy=size/2,circ=2*Math.PI*r;
  const total=segments.reduce((s,seg)=>s+seg.value,0);
  let offset=0;
  const slices=segments.map(seg=>{ const pct=total?seg.value/total:0; const dash=pct*circ; const s={...seg,dash,gap:circ-dash,offset}; offset+=dash; return s; });
  return (
    <svg width={size} height={size} viewBox={"0 0 "+size+" "+size}>
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#F1F5F9" strokeWidth={22}/>
      {slices.filter(s=>s.dash>0).map((s,i)=><circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={s.color} strokeWidth={22} strokeDasharray={s.dash+" "+s.gap} strokeDashoffset={-s.offset} style={{transform:"rotate(-90deg)",transformOrigin:"center"}}/>)}
      <text x={cx} y={cy-6} textAnchor="middle" fontSize="11" fill="#64748B" fontFamily="system-ui">Total</text>
      <text x={cx} y={cy+12} textAnchor="middle" fontSize="12" fill="#1E3A5F" fontWeight="bold" fontFamily="system-ui">{total.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0})}</text>
    </svg>
  );
}

function BarChart({data,height=120}){
  const maxVal=Math.max(...data.map(d=>d.value),1);
  const n=data.length;
  const bw=Math.max(24,Math.floor(280/n)-8);
  const totalW=n*(bw+8);
  return (
    <svg width="100%" viewBox={"0 0 "+totalW+" "+(height+40)} style={{overflow:"visible"}}>
      {data.map((d,i)=>{
        const bh=Math.max(4,(d.value/maxVal)*height);
        const x=i*(bw+8),y=height-bh;
        return (
          <g key={i}>
            <rect x={x} y={y} width={bw} height={bh} rx={4} fill={d.color} opacity={0.85}/>
            <text x={x+bw/2} y={height+16} textAnchor="middle" fontSize="9" fill="#64748B" fontFamily="system-ui">{d.label.length>8?d.label.slice(0,8)+"…":d.label}</text>
            {d.value>0&&<text x={x+bw/2} y={y-4} textAnchor="middle" fontSize="8" fill={d.color} fontWeight="bold" fontFamily="system-ui">{d.value.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0})}</text>}
          </g>
        );
      })}
    </svg>
  );
}

function CalendarTab({bills,onBillClick}){

  const days=Array.from({length:daysInMonth},(_,i)=>i+1);
  const byDay=useMemo(()=>{ const m={}; bills.forEach(b=>{ const d=new Date(b.dueDate+"T12:00:00"); if(d.getFullYear()===year&&d.getMonth()===month){ const day=d.getDate(); if(!m[day]) m[day]=[]; m[day].push(b); } }); return m; },[bills]);
  return (
    <div>
      <h3 style={{marginTop:0,color:"#1E3A5F",fontWeight:700,fontSize:17,textTransform:"capitalize"}}>📅 {now.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</h3>

        {Array(firstDay).fill(null).map((_,i)=><div key={"e"+i}/>)}
        {days.map(d=>{
          const items=byDay[d]||[];

          return (

              <div style={{fontWeight:isToday?800:500,fontSize:12,color:isToday?"#1E3A5F":"#374151",textAlign:"center",marginBottom:2}}>{d}</div>
              {items.map(b=>{ const s=computeStatus(b); const c=STATUS_COLOR[s]; return <div key={b.id} onClick={()=>onBillClick(b)} style={{fontSize:9,background:c.bg,color:c.text,borderRadius:3,padding:"2px 3px",marginTop:2,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",cursor:"pointer"}} title={b.name+" — "+fmt(b.amount)}>{b.name}</div>; })}

      </div>
    </div>
  );
}

              <input style={{...inp,maxWidth:240,flex:"1 1 180px"}} placeholder="🔍 Buscar..." value={search} onChange={e=>setSearch(e.target.value)}/>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                {FILTERS.map(f=><button key={f.id} onClick={()=>setFilter(f.id)} style={{padding:"8px 12px",borderRadius:8,border:"1.5px solid",borderColor:filter===f.id?"#1E3A5F":"#CBD5E1",background:filter===f.id?"#1E3A5F":"#fff",color:filter===f.id?"#fff":"#374151",cursor:"pointer",fontSize:12,fontWeight:600}}>{f.label}</button>)}
              </div>
            </div>
            {filtered.length===0?(
              <div style={{textAlign:"center",padding:48,color:"#94A3B8"}}>
                <Icon name="list" size={36} color="#CBD5E1"/>
                <div style={{marginTop:10,fontSize:15,fontWeight:600}}>Nenhuma conta encontrada</div>
                {!search&&filter==="all"&&<button onClick={()=>setShowAdd(true)} style={{marginTop:14,padding:"10px 20px",background:"#1E3A5F",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:14,fontWeight:700}}>Adicionar primeira conta</button>}
              </div>
            ):(
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {filtered.map(b=><BillRow key={b.id} bill={b} onClick={()=>setDetailBill(b)}/>)}
              </div>
            )}
          </div>
        )}
        {tab==="calendar"&&<CalendarTab bills={bills} onBillClick={b=>setDetailBill(b)}/>}
        {tab==="analytics"&&<AnalyticsTab bills={bills}/>}
      </div>

      <Modal open={showAdd} onClose={()=>setShowAdd(false)} title="Nova Conta"><BillForm onSave={addBill} onCancel={()=>setShowAdd(false)}/></Modal>
      <Modal open={!!editBill} onClose={()=>setEditBill(null)} title="Editar Conta">{editBill&&<BillForm initial={editBill} onSave={saveBill} onCancel={()=>setEditBill(null)}/>}</Modal>
      <Modal open={!!payBill} onClose={()=>setPayBill(null)} title="Registrar Pagamento">{payBill&&<PayModal bill={payBill} onPay={payBillFn} onCancel={()=>setPayBill(null)}/>}</Modal>
      <Modal open={!!delId} onClose={()=>setDelId(null)} title="Confirmar exclusão">
        <p style={{color:"#374151",margin:"0 0 18px"}}>Tem certeza que deseja excluir esta conta? Esta ação não pode ser desfeita.</p>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={()=>setDelId(null)} style={{padding:"10px 18px",borderRadius:8,border:"1.5px solid #CBD5E1",background:"#fff",cursor:"pointer",fontSize:14,fontWeight:600,color:"#374151"}}>Cancelar</button>
          <button onClick={()=>deleteBill(delId)} style={{padding:"10px 18px",borderRadius:8,border:"none",background:"#E74C3C",color:"#fff",cursor:"pointer",fontSize:14,fontWeight:700}}>Excluir</button>
        </div>
      </Modal>
      <Modal open={!!noProofBill} onClose={()=>setNoProofBill(null)} title="Pagamento sem comprovante">{noProofBill&&<NoProofModal bill={noProofBill} onClose={()=>setNoProofBill(null)} onAddProof={addProof}/>}</Modal>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App/>);
  </script>

  <script>
    // Registra Service Worker para offline
    if('serviceWorker' in navigator){
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(r => console.log('SW registrado:', r.scope))
          .catch(e => console.log('SW erro:', e));
      });
    }
  </script>
</body>
</html>
